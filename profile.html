
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | AI Scam Detector</title>
<link rel="stylesheet" href="style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #050b12;
    color: #eaf1fa;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(145deg, #142536, #091522);
    border: 1px solid #00e88f55;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 0 30px #00ff8825;
}

.logo {
    display: block;
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin: 0 auto 15px;
    filter: drop-shadow(0 0 12px #00ff88);
}

h1 {
    text-align: center;
    color: #00e88f;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #c4ced8;
    margin-bottom: 30px;
    line-height: 1.5;
}

label {
    display: block;
    margin: 18px 0 8px;
    color: #dce6f1;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    background: #0b1522;
    border: 1px solid #526477;
    border-radius: 9px;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #00e88f;
    box-shadow: 0 0 10px #00e88f35;
}

input[readonly] {
    opacity: 0.7;
    cursor: not-allowed;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #00d982;
    color: #07151b;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00f5a0;
    box-shadow: 0 0 18px #00ff8870;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
}

.navigation {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 28px;
}

.navigation a {
    color: #00e88f;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

.navigation a:hover {
    color: white;
}

@media (max-width: 500px) {
    .container {
        padding: 25px 20px;
    }

    .navigation {
        gap: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.jpeg"
         alt="AI Scam Detector Shield"
         class="logo">

    <h1>My Profile</h1>

    <p class="subtitle">
        Manage your AI Scam Detector Account
    </p>

    <form id="profileForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            autocomplete="name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Your email"
            readonly
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            autocomplete="tel"
        >

        <button type="submit" id="saveButton">
            SAVE PROFILE
        </button>

    </form>

    <p id="message" role="status"></p>

    <div class="navigation">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logout">Logout</a>
    </div>

</div>

<script>

const API = "http://127.0.0.1:5000";

// Load Profile
async function loadProfile() {

    const message = document.getElementById("message");

    try {

        const response = await fetch(API + "/api/profile", {
            method: "GET",
            credentials: "include"
        });

        if (response.status === 401) {
            window.location.href = "login.html";
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.error || "Unable to load profile.";
            message.style.color = "#ff5555";
            return;
        }

        const user = data.user || data;

        document.getElementById("name").value = user.name || "";
        document.getElementById("email").value = user.email || "";
        document.getElementById("phone").value = user.phone || "";

    } catch (error) {

        message.textContent = "Unable to connect to server.";
        message.style.color = "#ff5555";

    }
}


// Save Profile
document.getElementById("profileForm").addEventListener("submit",
async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const message = document.getElementById("message");
    const button = document.getElementById("saveButton");

    button.disabled = true;
    message.textContent = "Updating profile...";
    message.style.color = "#00e88f";

    try {

        const response = await fetch(API + "/api/profile", {
            method: "PUT",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                phone: phone
            })
        });

        const data = await response.json();

        if (response.ok) {
            message.textContent = "Profile updated successfully!";
            message.style.color = "#00e88f";
        } else {
            message.textContent = data.error || "Profile update failed.";
            message.style.color = "#ff5555";
        }

    } catch (error) {

        message.textContent = "Server connection failed.";
        message.style.color = "#ff5555";

    } finally {

        button.disabled = false;

    }

});


// Logout
document.getElementById("logout").addEventListener("click",
async function(event) {

    event.preventDefault();

    try {

        const response = await fetch(API + "/api/logout", {
            method: "POST",
            credentials: "include"
        });

        if (response.ok) {
            window.location.href = "login.html";
        } else {
            alert("Logout failed. Please try again.");
        }

    } catch (error) {

        alert("Unable to connect to server.");

    }

});

loadProfile();

</script>

</body>
</html>
