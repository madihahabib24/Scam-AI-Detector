<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI Scam Detector</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: #050b12;
        }

        .register-box {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: linear-gradient(145deg, #142536, #091522);
            border: 1px solid #00e88f55;
            border-radius: 20px;
            box-shadow: 0 0 30px #00ff8825;
        }

        .register-logo {
            display: block;
            width: 105px;
            height: 105px;
            object-fit: contain;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 12px #00ff88);
        }

        .register-box h1 {
            color: #00e88f;
            text-align: center;
            margin-bottom: 10px;
        }

        .register-box p {
            color: #c4ced8;
            text-align: center;
            margin: 12px 0 25px;
        }

        .register-box label {
            display: block;
            color: white;
            margin: 16px 0 7px;
        }

        .register-box input {
            width: 100%;
            padding: 13px;
            background: #0c1725;
            border: 1px solid #526477;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .register-box input:focus {
            border-color: #00e88f;
            box-shadow: 0 0 10px #00e88f35;
        }

        .register-box button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #00d982;
            color: #071b16;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-box button:hover {
            background: #00f5a0;
            box-shadow: 0 0 18px #00ff8870;
        }

        .register-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .register-box a {
            display: block;
            text-align: center;
            color: #00e88f;
            margin-top: 20px;
            text-decoration: none;
        }

        #registerMessage {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="register-page">
        <div class="register-box">

            <img src="logo.jpeg"
                 alt="AI Scam Detector Shield"
                 class="register-logo">

            <h1>Create Account</h1>
            <p>Join AI Scam Detector</p>

            <form id="registerForm">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password (8 characters minimum)"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="registerButton">
                    CREATE ACCOUNT
                </button>

                <div id="registerMessage" role="status"></div>

            </form>

            <a href="login.html">
                Already have an account? Login
            </a>

            <a href="index.html">
                ← Back to Home
            </a>

        </div>
    </main>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = document.getElementById("registerMessage");
            const button = document.getElementById("registerButton");

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Creating account...";
            message.style.color = "#00e88f";
            button.disabled = true;

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Account created! Please login.";
                    message.style.color = "#00e88f";

                    setTimeout(function() {
                        window.location.href = "login.html";
                    }, 1500);

                } else {
                    message.textContent = data.error || "Registration failed.";
                    message.style.color = "#ff5555";
                    button.disabled = false;
                }

            } catch (error) {
                message.textContent = "Backend connection failed!";
                message.style.color = "#ff5555";
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
